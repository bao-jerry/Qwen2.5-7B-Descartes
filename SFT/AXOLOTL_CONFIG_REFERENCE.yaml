        minimum: 0.0
        type: number
    top_p:
      type: float
      required: false
      description: Top-p nucleus sampling threshold
      default: 1.0
      source: SFT/axolotl/src/axolotl/utils/schemas/config.py:163
      accepted_schema:
        maximum: 1.0
        minimum: 0.0
        type: number
    rl_coef:
      type: float
      required: false
      description: RL policy gradient loss coefficient
      default: 1.0
      source: SFT/axolotl/src/axolotl/utils/schemas/config.py:169
      accepted_schema:
        type: number
    advantage_estimator:
      type: Literal['rloo', 'group_norm', 'reinforce']
      required: false
      description: 'Advantage estimator: ''rloo'', ''group_norm'', ''reinforce'''
      default: rloo
      source: SFT/axolotl/src/axolotl/utils/schemas/config.py:173
      accepted_schema:
        enum:
        - rloo
        - group_norm
        - reinforce
        type: string
    min_completion_prefix:
      type: int
      required: false
      description: Minimum tokens into completion before placing anchors. Skips anchors too close to the prompt boundary where
        features are dominated by prompt context.
      default: 0
      source: SFT/axolotl/src/axolotl/utils/schemas/config.py:179
      accepted_schema:
        minimum: 0
        type: integer
  qat:
    activation_dtype:
      type: axolotl.utils.schemas.enums.TorchAOQuantDType | None
      required: false
      description: Fake quantization layout to use for activation quantization.
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/quantization.py:36
      accepted_schema:
        anyOf:
        - $ref: '#/$defs/TorchAOQuantDType'
        - type: 'null'
    weight_dtype:
      type: <enum 'TorchAOQuantDType
      required: false
      description: Fake quantization layout to use for weight quantization.
      default: int8
      source: SFT/axolotl/src/axolotl/utils/schemas/quantization.py:40
      accepted_schema:
        $ref: '#/$defs/TorchAOQuantDType'
    quantize_embedding:
      type: bool | None
      required: false
      description: Quantize embedding
      default: false
      source: SFT/axolotl/src/axolotl/utils/schemas/quantization.py:44
      accepted_schema:
        anyOf:
        - type: boolean
        - type: 'null'
    group_size:
      type: int | None
      required: false
      description: The number of elements in each group for per-group fake quantization
      default: 32
      source: SFT/axolotl/src/axolotl/utils/schemas/quantization.py:47
      accepted_schema:
        anyOf:
        - type: integer
        - type: 'null'
    fake_quant_after_n_steps:
      type: int | None
      required: false
      description: The number of steps to apply fake quantization after
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/quantization.py:51
      accepted_schema:
        anyOf:
        - type: integer
        - type: 'null'
  quantization:
    weight_dtype:
      type: <enum 'TorchAOQuantDType
      required: false
      description: Fake quantization layout to use for weight quantization.
      default: int8
      source: SFT/axolotl/src/axolotl/utils/schemas/quantization.py:66
      accepted_schema:
        $ref: '#/$defs/TorchAOQuantDType'
    activation_dtype:
      type: axolotl.utils.schemas.enums.TorchAOQuantDType | None
      required: false
      description: Fake quantization layout to use for activation quantization.
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/quantization.py:70
      accepted_schema:
        anyOf:
        - $ref: '#/$defs/TorchAOQuantDType'
        - type: 'null'
    quantize_embedding:
      type: bool | None
      required: false
      description: Whether to quantize the embedding layer.
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/quantization.py:74
      accepted_schema:
        anyOf:
        - type: boolean
        - type: 'null'
    group_size:
      type: int | None
      required: false
      description: The number of elements in each group for per-group fake quantization
      default: 32
      source: SFT/axolotl/src/axolotl/utils/schemas/quantization.py:77
      accepted_schema:
        anyOf:
        - type: integer
        - type: 'null'
  dynamic_checkpoint:
    enabled:
      type: bool
      required: false
      description: 'Enable dynamic checkpoint triggering during training. Create a file ''axolotl_checkpoint.save'' in the
        configured `output_dir` to trigger. '
      default: false
      source: SFT/axolotl/src/axolotl/utils/schemas/dynamic_checkpoint.py:9
      accepted_schema:
        type: boolean
    check_interval:
      type: int
      required: false
      description: 'Check for trigger file every N steps (reduces I/O overhead). Default: 100'
      default: 10
      source: SFT/axolotl/src/axolotl/utils/schemas/dynamic_checkpoint.py:16
      accepted_schema:
        minimum: 1
        type: integer
    trigger_file_path:
      type: str
      required: false
      description: Custom trigger filename (optional). If not specified, defaults to 'axolotl_checkpoint.save'. Specify a
        filename (not a full path) to override the default.
      default: ''
      source: SFT/axolotl/src/axolotl/utils/schemas/dynamic_checkpoint.py:24
      accepted_schema:
        type: string
  fsdp_config:
    fsdp_version:
      type: int | None
      required: false
      description: FSDP version
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:15
      accepted_schema:
        anyOf:
        - type: integer
        - type: 'null'
    activation_checkpointing:
      type: bool | None
      required: false
      description: Enable activation checkpointing to reduce memory usage during forward passes
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:20
      accepted_schema:
        anyOf:
        - type: boolean
        - type: 'null'
    offload_params:
      type: bool | None
      required: false
      description: Offload parameters to CPU to reduce GPU memory usage
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:24
      accepted_schema:
        anyOf:
        - type: boolean
        - type: 'null'
    sync_module_states:
      type: bool | None
      required: false
      description: Synchronize module states across all processes
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:28
      accepted_schema:
        anyOf:
        - type: boolean
        - type: 'null'
    cpu_ram_efficient_loading:
      type: bool | None
      required: false
      description: Enable CPU RAM efficient loading to reduce memory usage during model loading
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:32
      accepted_schema:
        anyOf:
        - type: boolean
        - type: 'null'
    cpu_offload_pin_memory:
      type: bool | None
      required: false
      description: Disabling this enables swap memory usage for resource-constrained setups when offload_params is enabled.
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:36
      accepted_schema:
        anyOf:
        - type: boolean
        - type: 'null'
    use_orig_params:
      type: bool | None
      required: false
      description: Use original parameters instead of flattened parameters
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:40
      accepted_schema:
        anyOf:
        - type: boolean
        - type: 'null'
    state_dict_type:
      type: Optional[Literal['FULL_STATE_DICT', 'LOCAL_STATE_DICT', 'SHARDED_STATE_DICT']]
      required: false
      description: Type of state dict to use for saving/loading checkpoints
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:45
      accepted_schema:
        anyOf:
        - enum:
          - FULL_STATE_DICT
          - LOCAL_STATE_DICT
          - SHARDED_STATE_DICT
          type: string
        - type: 'null'
    final_state_dict_type:
      type: Optional[Literal['FULL_STATE_DICT', 'LOCAL_STATE_DICT', 'SHARDED_STATE_DICT']]
      required: false
      description: Final state dict type to use after training completion
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:51
      accepted_schema:
        anyOf:
        - enum:
          - FULL_STATE_DICT
          - LOCAL_STATE_DICT
          - SHARDED_STATE_DICT
          type: string
        - type: 'null'
    auto_wrap_policy:
      type: Optional[Literal['TRANSFORMER_BASED_WRAP', 'SIZE_BASED_WRAP']]
      required: false
      description: Policy for automatically wrapping modules with FSDP
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:58
      accepted_schema:
        anyOf:
        - enum:
          - TRANSFORMER_BASED_WRAP
          - SIZE_BASED_WRAP
          type: string
        - type: 'null'
    transformer_layer_cls_to_wrap:
      type: str | None
      required: false
      description: Class name of transformer layers to wrap (e.g., 'LlamaDecoderLayer')
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:64
      accepted_schema:
        anyOf:
        - type: string
        - type: 'null'
    min_num_params:
      type: int | None
      required: false
      description: Minimum parameter count a module must have to be wrapped under the SIZE_BASED_WRAP policy
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:69
      accepted_schema:
        anyOf:
        - minimum: 1
          type: integer
        - type: 'null'
    reshard_after_forward:
      type: bool | None
      required: false
      description: Reshard parameters after forward pass to save memory
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:75
      accepted_schema:
        anyOf:
        - type: boolean
        - type: 'null'
    mixed_precision_policy:
      type: str | None
      required: false
      description: Mixed precision policy for FSDP (e.g., 'fp16', 'bf16')
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/fsdp.py:79
      accepted_schema:
        anyOf:
        - type: string
        - type: 'null'
  special_tokens:
    bos_token:
      type: str | None
      required: false
      description: null
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/model.py:182
      accepted_schema:
        anyOf:
        - type: string
        - type: 'null'
    eos_token:
      type: str | None
      required: false
      description: null
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/model.py:183
      accepted_schema:
        anyOf:
        - type: string
        - type: 'null'
    pad_token:
      type: str | None
      required: false
      description: null
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/model.py:184
      accepted_schema:
        anyOf:
        - type: string
        - type: 'null'
    unk_token:
      type: str | None
      required: false
      description: null
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/model.py:185
      accepted_schema:
        anyOf:
        - type: string
        - type: 'null'
    additional_special_tokens:
      type: list[str] | None
      required: false
      description: null
      default: null
      source: SFT/axolotl/src/axolotl/utils/schemas/model.py:186
      accepted_schema:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
schema_definitions:
  ChatTemplate:
    description: Chat templates configuration subset
    enum:
    - alpaca
    - chatml
    - mistral_v1
    - mistral_v2v3
    - mistral_v3_tekken
    - mistral_v7_tekken
    - gemma
    - cohere
    - llama3
    - llama3_2_vision
    - llama4
    - phi_3
    - phi_35
    - deepseek_v2
    - deepseek_v3
    - jamba
    - jinja
    - qwen_25
    - qwen3
    - qwen3_5
    - falcon_h1
    - nemotron_h
    - tokenizer_default
    - exaone
    - exaone4
    - metharme
    - pixtral
    - llava
    - qwen2_vl
    - gemma3
    - gemma3n
    - gemma4
    - gemma4_unified
    - command_a
    - command_a_tool_use
    - command_a_rag
    - aya
    title: ChatTemplate
    type: string
  CustomSupportedOptimizers:
    description: Custom supported optimizers
    enum:
    - optimi_adamw
    - ao_adamw_4bit
    - ao_adamw_8bit
    - ao_adamw_fp8
    - adopt_adamw
    - came_pytorch
    - muon
    - dion
    - sinkgd
    - flash_adamw
    - flash_adam
    - flash_sgd
    - flash_sgdw
    - flash_lion
    - q_galore_adamw8bit
    title: CustomSupportedOptimizers
    type: string
  DPODataset:
    description: DPO configuration subset
    properties:
      path:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Path
      split:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Split
      type:
        anyOf:
        - $ref: '#/$defs/UserDefinedDPOType'
        - type: string
        - type: 'null'
        default: null
        title: Type
      data_files:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        title: Data Files
      revision:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Revision
      field_messages:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Field Messages
      field_chosen:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Field Chosen
      field_rejected:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Field Rejected
    title: DPODataset
    type: object
  DynamicCheckpointConfig:
    description: Configuration for dynamic checkpoint triggering during training.
    properties:
      enabled:
        default: false
        description: 'Enable dynamic checkpoint triggering during training. Create a file ''axolotl_checkpoint.save'' in the
          configured `output_dir` to trigger. '
        title: Enabled
        type: boolean
      check_interval:
        default: 10
        description: 'Check for trigger file every N steps (reduces I/O overhead). Default: 100'
        minimum: 1
        title: Check Interval
        type: integer
      trigger_file_path:
        default: ''
        description: Custom trigger filename (optional). If not specified, defaults to 'axolotl_checkpoint.save'. Specify
          a filename (not a full path) to override the default.
        title: Trigger File Path
        type: string
    title: DynamicCheckpointConfig
    type: object
  EBFTConfig:
    description: Configuration for Energy-Based Fine-Tuning (EBFT)
    properties:
      feature_layers:
        default:
        - 0.25
        - 0.5
        - 0.75
        description: Fractional layer depths for feature extraction (e.g., [0.25, 0.5, 0.75])
        items:
          type: number
        title: Feature Layers
        type: array
      embed_method:
        default: last_token
        description: 'Embedding method: ''last_token'', ''mean_pooling'', ''completion_mean'', or ''concat'''
        enum:
        - last_token
        - mean_pooling
        - completion_mean
        - concat
        title: Embed Method
        type: string
      use_whitening:
        default: false
        description: Apply SVD whitening to feature embeddings
        title: Use Whitening
        type: boolean
      alignment_coef:
        default: 1.0
        description: Coefficient for alignment reward (cosine similarity with ground truth)
        title: Alignment Coef
        type: number
      diversity_coef:
        default: 1.0
        description: Coefficient for diversity penalty (pairwise similarity between samples)
        title: Diversity Coef
        type: number
      ce_coef:
        default: 0.0
        description: Cross-entropy loss coefficient on ground-truth tokens
        title: Ce Coef
        type: number
      adaptive_max_tokens:
        default: true
        description: Set per-batch max_tokens based on ground-truth length
        title: Adaptive Max Tokens
        type: boolean
      gt_length_multiplier:
        default: 1.5
        description: Multiplier for ground-truth token count when computing adaptive max_tokens
        minimum: 0.1
        title: Gt Length Multiplier
        type: number
      mode:
        default: structured
        description: 'EBFT mode: ''structured'' (QA with vLLM) or ''strided'' (unstructured text)'
        enum:
        - structured
        - strided
        title: Mode
        type: string
      stride:
        default: 8
        description: Stride between anchor points (tokens)
        minimum: 1
        title: Stride
        type: integer
      context_length:
        default: 8
        description: Context window size per block
        minimum: 1
        title: Context Length
        type: integer
      generate_max_len:
        default: 8
        description: Tokens to generate per block
        minimum: 1
        title: Generate Max Len
        type: integer
      n_samples_per_prompt:
        default: 4
        description: Independent rollouts per document
        minimum: 1
        title: N Samples Per Prompt
        type: integer
      temperature:
        default: 0.6
        description: Sampling temperature for strided generation
        minimum: 0.0
        title: Temperature
        type: number
      top_p:
        default: 1.0
        description: Top-p nucleus sampling threshold
        maximum: 1.0
        minimum: 0.0
        title: Top P
        type: number
      rl_coef:
        default: 1.0
        description: RL policy gradient loss coefficient
        title: Rl Coef
        type: number
      advantage_estimator:
        default: rloo
        description: 'Advantage estimator: ''rloo'', ''group_norm'', ''reinforce'''
        enum:
        - rloo
        - group_norm
        - reinforce
        title: Advantage Estimator
        type: string
      min_completion_prefix:
        default: 0
        description: Minimum tokens into completion before placing anchors. Skips anchors too close to the prompt boundary
          where features are dominated by prompt context.
        minimum: 0
        title: Min Completion Prefix
        type: integer
    title: EBFTConfig
    type: object
  FSDPConfig:
    description: FSDP Configuration Schema
    properties:
      fsdp_version:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        description: FSDP version
        title: Fsdp Version
      activation_checkpointing:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Enable activation checkpointing to reduce memory usage during forward passes
        title: Activation Checkpointing
      offload_params:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Offload parameters to CPU to reduce GPU memory usage
        title: Offload Params
      sync_module_states:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Synchronize module states across all processes
        title: Sync Module States
      cpu_ram_efficient_loading:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Enable CPU RAM efficient loading to reduce memory usage during model loading
        title: Cpu Ram Efficient Loading
      cpu_offload_pin_memory:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Disabling this enables swap memory usage for resource-constrained setups when offload_params is enabled.
        title: Cpu Offload Pin Memory
      use_orig_params:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Use original parameters instead of flattened parameters
        title: Use Orig Params
      state_dict_type:
        anyOf:
        - enum:
          - FULL_STATE_DICT
          - LOCAL_STATE_DICT
          - SHARDED_STATE_DICT
          type: string
        - type: 'null'
        default: null
        description: Type of state dict to use for saving/loading checkpoints
        title: State Dict Type
      final_state_dict_type:
        anyOf:
        - enum:
          - FULL_STATE_DICT
          - LOCAL_STATE_DICT
          - SHARDED_STATE_DICT
          type: string
        - type: 'null'
        default: null
        description: Final state dict type to use after training completion
        title: Final State Dict Type
      auto_wrap_policy:
        anyOf:
        - enum:
          - TRANSFORMER_BASED_WRAP
          - SIZE_BASED_WRAP
          type: string
        - type: 'null'
        default: null
        description: Policy for automatically wrapping modules with FSDP
        title: Auto Wrap Policy
      transformer_layer_cls_to_wrap:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Class name of transformer layers to wrap (e.g., 'LlamaDecoderLayer')
        title: Transformer Layer Cls To Wrap
      min_num_params:
        anyOf:
        - minimum: 1
          type: integer
        - type: 'null'
        default: null
        description: Minimum parameter count a module must have to be wrapped under the SIZE_BASED_WRAP policy
        title: Min Num Params
      reshard_after_forward:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Reshard parameters after forward pass to save memory
        title: Reshard After Forward
      mixed_precision_policy:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Mixed precision policy for FSDP (e.g., 'fp16', 'bf16')
        title: Mixed Precision Policy
    title: FSDPConfig
    type: object
  KTODataset:
    description: KTO configuration subset
    properties:
      path:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Path
      split:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Split
      type:
        anyOf:
        - $ref: '#/$defs/UserDefinedKTOType'
        - type: string
        - type: 'null'
        default: null
        title: Type
      data_files:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        title: Data Files
      trust_remote_code:
        anyOf:
        - type: boolean
        - type: 'null'
        default: false
        title: Trust Remote Code
      revision:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Revision
    title: KTODataset
    type: object
  LoftQConfig:
    description: LoftQ configuration subset
    properties:
      loftq_bits:
        default: 4
        description: typically 4 bits
        title: Loftq Bits
        type: integer
    title: LoftQConfig
    type: object
  LrGroup:
    description: Custom learning rate group configuration
    properties:
      name:
        title: Name
        type: string
      modules:
        items:
          type: string
        title: Modules
        type: array
      lr:
        title: Lr
        type: number
    required:
    - name
    - modules
    - lr
    title: LrGroup
    type: object
  PTQConfig:
    description: PTQ Config Schema
    properties:
      weight_dtype:
        $ref: '#/$defs/TorchAOQuantDType'
        default: int8
        description: Fake quantization layout to use for weight quantization.
      activation_dtype:
        anyOf:
        - $ref: '#/$defs/TorchAOQuantDType'
        - type: 'null'
        default: null
        description: Fake quantization layout to use for activation quantization.
      quantize_embedding:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Whether to quantize the embedding layer.
        title: Quantize Embedding
      group_size:
        anyOf:
        - type: integer
        - type: 'null'
        default: 32
        description: The number of elements in each group for per-group fake quantization
        title: Group Size
    title: PTQConfig
    type: object
  PeftConfig:
    description: peftq configuration subset
    properties:
      loftq_config:
        anyOf:
        - $ref: '#/$defs/LoftQConfig'
        - type: 'null'
        default: null
        description: Configuration options for loftq initialization for LoRA
    title: PeftConfig
    type: object
  PretrainingDataset:
    description: Pretraining dataset configuration subset
    properties:
      name:
        anyOf:
        - type: string
