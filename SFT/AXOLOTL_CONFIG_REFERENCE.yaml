    type: object
  SFTDataset:
    description: SFT configuration subset
    properties:
      path:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: HuggingFace dataset repo | s3:// | gs:// | path to local file or directory
        title: Path
      split:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: name of dataset split to load from
        title: Split
      type:
        anyOf:
        - type: string
        - $ref: '#/$defs/UserDefinedPrompterType'
        - type: 'null'
        default: null
        description: The type of prompt to use for training. [alpaca, gpteacher, oasst, reflection]
        title: Type
      input_transform:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Input Transform
      shards:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        description: split dataset into N pieces (use with shards_idx)
        title: Shards
      shards_idx:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        description: the index of sharded dataset to use
        title: Shards Idx
      preprocess_shards:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        description: process dataset in N sequential chunks for memory efficiency (exclusive with `shards`)
        title: Preprocess Shards
      conversation:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Conversation
      chat_template:
        anyOf:
        - $ref: '#/$defs/ChatTemplate'
        - type: string
        - type: 'null'
        default: null
        description: 'The name of the chat template to use for training, following values are supported: tokenizer_default:
          Uses the chat template that is available in the tokenizer_config.json. If the chat template is not available in
          the tokenizer, it will raise an error. This is the default. alpaca/inst/chatml/gemma/cohere/llama3/phi_3/deepseek_v2/jamba:
          These chat templates are available in the axolotl codebase at src/axolotl/utils/chat_templates.py. tokenizer_default_fallback_*:
          where * is the name of the chat template to fallback to if the tokenizer does not have a chat template else default
          to tokenizer. E.g. tokenizer_default_fallback_chatml. jinja: Uses a custom jinja template for the chat template.
          The custom jinja template should be provided in the chat_template_jinja field.'
        title: Chat Template
      chat_template_jinja:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: 'Custom jinja chat template or path to jinja file. Used only if `chat_template: jinja` or empty.'
        title: Chat Template Jinja
      data_files:
        anyOf:
        - type: string
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        description: path to source data files
        title: Data Files
      input_format:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Input Format
      name:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: name of dataset configuration to load
        title: Name
      ds_type:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: defines the datatype when path is a file
        title: Ds Type
      field:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: For `completion` datasets only, uses the provided field instead of `text` column
        title: Field
      field_human:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Field Human
      field_model:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Field Model
      field_messages:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: 'Key containing the messages (default: "messages")'
        title: Field Messages
      field_tools:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: 'Key containing the tools (default: "tools"). Must be a list[dict] and follow [JSON schema](https://json-schema.org/learn/getting-started-step-by-step).'
        title: Field Tools
      field_thinking:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: 'Key containing the reasoning trace (default: "reasoning_content").'
        title: Field Thinking
      template_thinking_key:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: The key the chat template expects that indicates the reasoning trace.
        title: Template Thinking Key
      message_field_role:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Message Field Role
      message_field_content:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Message Field Content
      message_property_mappings:
        anyOf:
        - additionalProperties:
            type: string
          type: object
        - type: 'null'
        default: null
        description: 'Mapping of properties from the input dataset to the chat template. (default: message_property_mappings={''role'':''role'',
          ''content'':''content''}) If a property exists in the template but not in this mapping, the system will attempt
          to load it directly from the message using the property name as the key. Example: In the mapping below, ''from''
          is loaded from input dataset and used as ''role'', while ''value'' is loaded and used as ''content'' in the chat
          template.'
        title: Message Property Mappings
      message_field_training:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: The key in the message turn that indicates via boolean whether tokens of a turn should be considered
          for training. Useful to selectively train on certain turns besides the `roles_to_train`.
        title: Message Field Training
      message_field_training_detail:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: The key in the message turn that contains the training details. Useful to selectively train on certain
          tokens in a turn. The value of the key is a List[Dict] containing `begin_offset` (start character index in content),
          `end_offset` (end character index in content), and `train` (boolean whether to train).
        title: Message Field Training Detail
      split_thinking:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: (for Qwen3 template only) Whether to split the assistant content based on a reasoning trace inside delimited
          tags
        title: Split Thinking
      logprobs_field:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Logprobs Field
      temperature:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        title: Temperature
      roles_to_train:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        description: Roles to train on. The tokens from these roles will be considered for the loss.
        title: Roles To Train
      train_on_eos:
        anyOf:
        - enum:
          - all
          - turn
          - last
          - none
          type: string
        - type: 'null'
        default: null
        description: 'Which EOS tokens to train on in the conversation. Possible values are: all: train on all EOS tokens,
          turn (default): train on the EOS token at the end of each trainable turn, last: train on the last EOS token in the
          conversation, none: never train on EOS tokens'
        title: Train On Eos
      train_on_eot:
        anyOf:
        - enum:
          - all
          - turn
          - last
          - none
          type: string
        - type: 'null'
        default: null
        description: Which EOT (end-of-turn) tokens to train on. Same values as train_on_eos. Defaults to the train_on_eos
          setting when unset.
        title: Train On Eot
      roles:
        anyOf:
        - additionalProperties:
            items:
              type: string
            type: array
          type: object
        - type: 'null'
        default: null
        description: 'Roles mapping in the messages. The format is {target_role: [source_roles]}. All source roles will be
          mapped to the target role. The default is: user: ["human", "user"], assistant: ["gpt", "assistant"], system: ["system"],
          tool: ["tool"]'
        title: Roles
      drop_system_message:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Whether to drop the system turn from the dataset. Only works with chat_template. This does not drop the
          default system message from chat_template if it exists. If you wish to, we recommend using a custom jinja template
          with the default system message removed or adding a system turn with empty content.
        title: Drop System Message
      trust_remote_code:
        anyOf:
        - type: boolean
        - type: 'null'
        default: false
        description: Trust remote code for untrusted source
        title: Trust Remote Code
      revision:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: The specific revision of the dataset to use when loading from the Hugging Face Hub. This can be a commit
          hash, tag, or branch name. If not specified, the latest version will be used. This parameter is ignored for local
          datasets.
        title: Revision
    title: SFTDataset
    type: object
  SelectiveCheckpointingConfig:
    description: Selective activation checkpointing (SAC) configuration
    properties:
      save:
        description: Ops to save during forward instead of recomputing in backward. 'attention' matches SDPA and flash-attention
          forward ops; other entries are substring-matched against qualified torch op names (e.g. 'aten::mm').
        items:
          type: string
        title: Save
        type: array
      save_sliding_window:
        default: false
        description: 'In hybrid full/sliding-window attention models, also save sliding-window attention calls. Default false:
          SWA is cheap to recompute, so only full-attention calls are saved.'
        title: Save Sliding Window
        type: boolean
      recompute_layer_types:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        description: Layer types (config.layer_types values) whose attention is recomputed instead of saved. Defaults to ['sliding_attention',
          'chunked_attention']. Ignored when save_sliding_window is true. Linear-attention layers never dispatch a matchable
          attention op, so they need no entry.
        title: Recompute Layer Types
      offload:
        default: false
        description: Offload saved tensors to pinned CPU memory (side-stream copies with backward prefetch) instead of keeping
          them on GPU.
        title: Offload
        type: boolean
    title: SelectiveCheckpointingConfig
