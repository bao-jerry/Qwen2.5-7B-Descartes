        title: Prefetch Depth
      vllm_sync_interval:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        description: Sync model weights to vLLM every N optimizer steps (async mode only).
        title: Vllm Sync Interval
      streaming_partial_batch:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Score prompt groups incrementally instead of the full batch at once.
        title: Streaming Partial Batch
      streaming_min_groups:
        anyOf:
        - type: integer
        - type: 'null'
        default: null
        description: Minimum prompt groups to score per streaming chunk.
        title: Streaming Min Groups
      vllm_importance_sampling_correction:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Apply IS correction for distribution mismatch between vLLM and training model.
        title: Vllm Importance Sampling Correction
      vllm_importance_sampling_mode:
        anyOf:
        - enum:
          - token_truncate
          - token_mask
          - sequence_truncate
          - sequence_mask
          type: string
        - type: 'null'
        default: null
        description: 'IS mode: token_truncate, token_mask, sequence_truncate, or sequence_mask.'
        title: Vllm Importance Sampling Mode
      vllm_importance_sampling_cap:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        description: Cap C for IS ratio clipping/masking.
        title: Vllm Importance Sampling Cap
      off_policy_mask_threshold:
        anyOf:
        - type: number
        - type: 'null'
        default: null
        description: KL threshold for off-policy sequence masking (OPSM). None = disabled.
        title: Off Policy Mask Threshold
      use_bias_correction_kl:
        anyOf:
        - type: boolean
        - type: 'null'
        default: null
        description: Apply IS correction to KL divergence term.
        title: Use Bias Correction Kl
      reward_num_workers:
        default: 1
        description: Number of persistent subprocess workers for parallel reward computation. Each worker has its own main
          thread so signal.alarm() (used by math_verify) works correctly. Work is sharded across workers by prompt groups.
          Only used with use_data_producer=True and non-nn.Module reward functions.
        title: Reward Num Workers
        type: integer
      replay_buffer_size:
        default: 0
        description: '[Experimental, disabled by default] Size of the replay buffer for storing high-signal rollout groups.
          When > 0, groups with reward variance are cached and used to replace zero-signal groups (where all rewards are identical).
          Set to 0 to disable. Only used with use_data_producer=True.'
        title: Replay Buffer Size
        type: integer
      replay_recompute_logps:
        default: true
        description: When True (default), recompute old_per_token_logps for replayed groups using the current training model.
          This fixes the importance sampling mismatch that occurs when replaying stale data. Only relevant when replay_buffer_size
          > 0.
        title: Replay Recompute Logps
        type: boolean
      reroll_start_fraction:
        default: 1.0
        description: Fraction of total training steps after which deferred re-rolling begins. Zero-signal prompts (where all
          rewards in a group are identical) are buffered and re-injected into later batches when the model is more likely
          to solve them. Set to 1.0 to disable. Only used with use_data_producer=True.
        title: Reroll Start Fraction
        type: number
      reroll_max_groups:
        default: 1
        description: Maximum number of prompt groups to replace with re-roll candidates per batch. Higher values increase
          data utilization but reduce prompt diversity. Only used with use_data_producer=True.
        title: Reroll Max Groups
        type: integer
      skip_zero_advantage_batches:
        default: true
        description: When True, skip gradient computation for micro-batches where all advantages are zero (no learning signal).
          This avoids the forward/backward pass entirely when no learning signal is present. The step is logged with skipped_zero_adv_batches=1
          for monitoring.
        title: Skip Zero Advantage Batches
        type: boolean
      vllm_lora_sync:
        default: false
        description: Sync LoRA adapter to vLLM via filesystem instead of merging + NCCL broadcast. Auto-selects vllm_serve_lora
          serve module. Syncs only LoRA adapter weights vs full merged model.
        title: Vllm Lora Sync
        type: boolean
    title: TRLConfig
